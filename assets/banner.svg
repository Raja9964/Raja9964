<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-labelledby="title desc">
  <title id="title">Raja Mohamad, Data Engineering Intern at Cuedo Analytics</title>
  <desc id="desc">Raw data in. Reliable insights out.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1020"/>
      <stop offset="1" stop-color="#10203f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.8" cy="0.35" r="0.6">
      <stop offset="0" stop-color="#2563eb" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#ffffff" stroke-opacity="0.045"/>
    </pattern>
    <g id="db">
      <path d="M0 6v24c0 3.3 8 6 18 6s18-2.7 18-6V6" fill="#13213d" stroke="#60a5fa" stroke-opacity="0.75"/>
      <path d="M0 18c0 3.3 8 6 18 6s18-2.7 18-6" fill="none" stroke="#60a5fa" stroke-opacity="0.35"/>
      <ellipse cx="18" cy="6" rx="18" ry="6" fill="#1b2d52" stroke="#60a5fa" stroke-opacity="0.75"/>
    </g>
    <path id="f1" d="M716 95C750 95 752 150 786 150H928"/>
    <path id="f2" d="M716 150H928"/>
    <path id="f3" d="M716 205C750 205 752 150 786 150H928"/>
  </defs>

  <rect width="1000" height="300" rx="18" fill="url(#bg)"/>
  <rect width="1000" height="300" rx="18" fill="url(#grid)"/>
  <rect width="1000" height="300" rx="18" fill="url(#glow)"/>

  <g font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">
    <line x1="48" y1="65" x2="72" y2="65" stroke="#60a5fa" stroke-width="2"/>
    <text x="82" y="70" font-family="'Cascadia Code', 'SF Mono', Consolas, Menlo, monospace" font-size="13" letter-spacing="3" fill="#60a5fa">DATA ENGINEERING</text>
    <text x="46" y="128" font-size="52" font-weight="700" letter-spacing="-1" fill="#f8fafc">Raja Mohamad</text>
    <text x="48" y="170" font-size="25" font-weight="600" fill="url(#accent)">Raw data in. Reliable insights out.</text>
    <text x="48" y="204" font-size="17" fill="#cbd5e1">Data Engineering Intern @ Cuedo Analytics · Bengaluru</text>

    <g font-size="13" fill="#e2e8f0" text-anchor="middle">
      <rect x="48" y="226" width="206" height="30" rx="15" fill="#ff9900" fill-opacity="0.12" stroke="#ff9900" stroke-opacity="0.55"/>
      <text x="151" y="246">AWS Certified Data Engineer</text>
      <rect x="264" y="226" width="228" height="30" rx="15" fill="#4285f4" fill-opacity="0.14" stroke="#4285f4" stroke-opacity="0.6"/>
      <text x="378" y="246">GCP Professional Data Engineer</text>
      <rect x="502" y="226" width="140" height="30" rx="15" fill="#22d3ee" fill-opacity="0.1" stroke="#22d3ee" stroke-opacity="0.5"/>
      <text x="572" y="246">2× IEEE Published</text>
    </g>
  </g>

  <g fill="none" stroke="#60a5fa" stroke-opacity="0.45" stroke-width="1.6" stroke-dasharray="4 5">
    <use href="#f1"/>
    <use href="#f2"/>
    <use href="#f3"/>
  </g>
  <use href="#db" x="680" y="77"/>
  <use href="#db" x="680" y="132"/>
  <use href="#db" x="680" y="187"/>

  <g font-family="'Cascadia Code', 'SF Mono', Consolas, Menlo, monospace" font-size="9.5" letter-spacing="0.5" text-anchor="middle" fill="#94a3b8">
    <circle cx="806" cy="150" r="9" fill="#2a1d12" stroke="#cd7f32" stroke-width="2"/>
    <text x="806" y="178">BRONZE</text>
    <circle cx="856" cy="150" r="9" fill="#1f2530" stroke="#c0c7d1" stroke-width="2"/>
    <text x="856" y="178">SILVER</text>
    <circle cx="906" cy="150" r="9" fill="#2b2410" stroke="#facc15" stroke-width="2"/>
    <text x="906" y="178">GOLD</text>
  </g>

  <g fill="#60a5fa">
    <rect x="936" y="160" width="8" height="16" rx="2" fill-opacity="0.55"/>
    <rect x="948" y="150" width="8" height="26" rx="2" fill-opacity="0.7"/>
    <rect x="960" y="138" width="8" height="38" rx="2" fill-opacity="0.85"/>
    <rect x="972" y="122" width="8" height="54" rx="2"/>
  </g>
  <polyline points="938,140 950,128 962,114 976,96" fill="none" stroke="#22d3ee" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M968 94l9-1-2 9" fill="none" stroke="#22d3ee" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <g fill="#22d3ee">
    <circle r="3.2" opacity="0">
      <animateMotion dur="3.2s" repeatCount="indefinite" begin="0s"><mpath href="#f1"/></animateMotion>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" dur="3.2s" repeatCount="indefinite" begin="0s"/>
    </circle>
    <circle r="3.2" opacity="0">
      <animateMotion dur="3.2s" repeatCount="indefinite" begin="1.1s"><mpath href="#f2"/></animateMotion>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" dur="3.2s" repeatCount="indefinite" begin="1.1s"/>
    </circle>
    <circle r="3.2" opacity="0">
      <animateMotion dur="3.2s" repeatCount="indefinite" begin="2.1s"><mpath href="#f3"/></animateMotion>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" dur="3.2s" repeatCount="indefinite" begin="2.1s"/>
    </circle>
  </g>

  <text x="952" y="278" text-anchor="end" font-family="'Cascadia Code', 'SF Mono', Consolas, Menlo, monospace" font-size="12" fill="#64748b">raja9964.github.io</text>
</svg>
